<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Accounting PoC</title>
<meta name="description" content="Accounting for small businesses and markets: auditable ledger, role-based views, Arabic and English.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/lib/theme-boot.js"></script>
<script src="/lib/preload-modules.js" async></script>
<!-- Start the two boot requests with the page instead of after the scripts have run (core/boot.js uses them right away). -->
<link rel="preload" href="/api/demo-users" as="fetch" crossorigin>
<link rel="preload" href="/api/ui-modules" as="fetch" crossorigin>
<!-- The shell module graph, fetched in parallel instead of one import level at a time (test/client.layout.test.js keeps this list complete). -->
<link rel="modulepreload" href="/core/api.js">
<link rel="modulepreload" href="/core/app.js">
<link rel="modulepreload" href="/core/boot.js">
<link rel="modulepreload" href="/core/events.js">
<link rel="modulepreload" href="/core/host.js">
<link rel="modulepreload" href="/core/i18n.js">
<link rel="modulepreload" href="/core/load.js">
<link rel="modulepreload" href="/core/login.js">
<link rel="modulepreload" href="/core/ready.js">
<link rel="modulepreload" href="/core/registry.js">
<link rel="modulepreload" href="/core/router.js">
<link rel="modulepreload" href="/core/state.js">
<link rel="modulepreload" href="/core/view.js">
<link rel="modulepreload" href="/lib/design-page.js">
<link rel="modulepreload" href="/lib/focus.js">
<link rel="modulepreload" href="/lib/format.js">
<link rel="modulepreload" href="/lib/html.js">
<link rel="modulepreload" href="/lib/icons.js">
<link rel="modulepreload" href="/lib/nav.js">
<link rel="modulepreload" href="/lib/router.js">
<link rel="modulepreload" href="/lib/search.js">
<link rel="modulepreload" href="/lib/shortcuts.js">
<link rel="modulepreload" href="/lib/theme.js">
<link rel="modulepreload" href="/lib/ui.js">
<link rel="modulepreload" href="/ui/actions.js">
<link rel="modulepreload" href="/ui/chrome.js">
<link rel="modulepreload" href="/ui/pages.js">
<link rel="modulepreload" href="/ui/palette.js">
</head>
<body>
<a class="skip-link" id="skip" href="#/" data-sh="skip">Skip to content</a>
<div id="app">
  <header class="topbar">
    <button type="button" class="icon-btn ghost" id="navToggle" data-sh="nav-toggle" aria-controls="nav" aria-expanded="true" aria-label="Menu">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span id="title">Accounting PoC</span></div>
    <button type="button" class="search-btn" id="search" data-sh="palette" aria-haspopup="dialog" aria-label="Search">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15zM21 21l-5.2-5.2"/></svg>
      <span class="search-text" id="searchText">Search…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-end">
      <label class="inline"><span id="lbl-user"></span><select id="user"></select></label>
      <span id="header-extra"></span>
      <button type="button" class="icon-btn" id="theme" data-sh="theme" aria-label="Theme"></button>
      <button type="button" id="lang" data-sh="lang" title="Language"></button>
      <div class="menu-wrap">
        <button type="button" class="icon-btn" id="userMenuBtn" data-sh="user-menu" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu" aria-label="Account"></button>
        <div class="menu" id="userMenu" hidden></div>
      </div>
    </div>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>
  <div class="shell">
    <nav class="sidenav" id="nav" aria-label="Main navigation"></nav>
    <div class="content">
      <main id="main" tabindex="-1"></main>
      <footer id="foot"></footer>
    </div>
  </div>
  <div class="drawer-scrim" data-sh="nav-close"></div>
  <nav class="bottomnav" id="bottomnav" aria-label="Quick navigation"></nav>
</div>
<section id="login" aria-label="Sign in" hidden></section>
<div id="overlay-root"></div>
<div id="toast" role="status" aria-live="polite" aria-atomic="false"></div>
<noscript><p>This application needs JavaScript.</p></noscript>
<!-- The shell: app.js builds the App object, then imports every file listed by GET /api/ui-modules. -->
<script type="module" src="/app.js"></script>
</body>
</html>
