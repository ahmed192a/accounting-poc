<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accounting PoC</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#667085; --line:#e4e7ec; --accent:#1f6feb; --good:#12805c; --warn:#b54708; --bad:#b42318; --good-bg:#e6f4ee; --warn-bg:#fff4e5; --bad-bg:#fdecea; --accent-bg:#e8f0fe; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; margin-inline-end:auto; }
  label.inline { display:flex; gap:6px; align-items:center; color:var(--muted); }
  select,input,button { font:inherit; }
  select,input[type=text],input[type=number],input[type=date] { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.small { padding:2px 8px; font-size:12px; }
  main { max-width:1180px; margin:0 auto; padding:16px 20px 60px; }
  .role-line { margin:4px 0 14px; color:var(--muted); }
  .role-line b { color:var(--ink); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { font-size:13px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .big { font-size:24px; font-weight:650; }
  .sub { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:start; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num,th.num { text-align:end; font-variant-numeric:tabular-nums; }
  td.sub { word-break:break-all; max-width:150px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .row > input[type=text] { flex:1; min-width:100px; }
  .chip { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:var(--accent-bg); color:var(--accent); white-space:nowrap; }
  .chip.good { background:var(--good-bg); color:var(--good); }
  .chip.warn { background:var(--warn-bg); color:var(--warn); }
  .chip.bad { background:var(--bad-bg); color:var(--bad); }
  .chip.mute { background:#eef0f3; color:var(--muted); }
  .note { padding:8px 10px; border-radius:6px; margin-top:8px; font-size:13px; }
  .note.warn { background:var(--warn-bg); color:var(--warn); }
  .note.good { background:var(--good-bg); color:var(--good); }
  .note.bad { background:var(--bad-bg); color:var(--bad); }
  .qty { width:64px; }
  .perm-grid { display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; font-size:12px; margin-top:6px; }
  #toast { position:fixed; inset-inline-end:16px; bottom:16px; max-width:380px; padding:10px 14px; border-radius:8px; color:#fff; display:none; z-index:20; }
  #toast.err { background:var(--bad); } #toast.ok { background:var(--good); }
  footer { max-width:1180px; margin:0 auto; padding:0 20px 30px; color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); font-style:italic; }
  @media (max-width:520px){ .perm-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <label class="inline"><span id="lbl-user"></span><select id="user"></select></label>
  <button id="lang" title="Language"></button>
  <span id="etaPill" class="chip"></span>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<div id="toast"></div>

<script>
const T = {
  en: {
    title:'Accounting PoC', user:'Signed in as', role:'Role', perms:'permissions', cash:'Cash', receivables:'Receivables', payables:'Payables', todaySales:'Sales today',
    open:'open', overdue:'overdue', sales:'sales', approvals:'Approval queue', nothing:'Nothing here.', approve:'Approve', pay:'Mark paid',
    quickSale:'Quick sale', total:'Total incl. VAT', complete:'Complete sale', invoice:'New invoice', customer:'Customer', desc:'Description', qty:'Qty',
    unitPrice:'Unit price (EGP)', create:'Create', bill:'New bill', supplier:'Supplier', category:'Category', amount:'Amount (EGP)', yourLimit:'Your limit',
    eta:'E-receipts (mock ETA)', online:'ETA online', offline:'ETA offline', goOffline:'Simulate offline', goOnline:'Go online', sync:'Sync queue now',
    waiting:'waiting', submitted:'submitted', dueSoon:'due soon', receipt:'Receipt', hoursLeft:'h left', overdueBy:'h late',
    st_submitted:'Submitted', st_queued:'Queued', st_due_soon:'Due soon', st_overdue:'Overdue', st_rejected:'Rejected',
    ledger:'Ledger', balanced:'Trial balance balanced', unbalanced:'Trial balance NOT balanced', lock:'Period lock', lockNone:'No lock set', soft:'soft', hard:'hard', none:'none',
    throughDate:'Through date', mode:'Mode', reason:'Reason', apply:'Apply', reverse:'Reverse', reversed:'reversed', reversal:'reversal', date:'Date', memo:'Memo', actionCol:'',
    reasonFor:'Reason for reversal', audit:'Audit log', search:'Search', time:'Time', who:'Who', action:'Action', detail:'Detail',
    admin:'Users and roles', export:'Export everything (JSON)', roleCol:'Role', newRole:'Create a role', roleName:'Role name', sodWarn:'Separation-of-duties warning',
    myWork:'My recent work', invoices:'Invoices', bills:'Bills', paid:'paid', pending:'pending approval', approved:'approved',
    advance:'Advance clock +6 hours (demo)', noteBox:'Proof of concept: demo identity switcher, mock ETA, in-memory data. Not for real accounting.',
    codeMissing:'no item code', saleDone:'Sale posted.', receiptStatus:'Receipt', saved:'Done.', lang:'العربية', ok:'OK', chooseItems:'Add a quantity to at least one item.',
    cat_purchases:'Purchases', cat_rent:'Rent', cat_utilities:'Utilities', ownBill:'your bill', overLimit:'over your limit', unlimited:'no limit',
    sodHint:'Role is saved. Check the warning above.',
  },
  ar: {
    title:'نموذج أولي للمحاسبة', user:'تسجيل الدخول باسم', role:'الدور', perms:'صلاحية', cash:'النقدية', receivables:'مستحقات العملاء', payables:'مستحقات الموردين', todaySales:'مبيعات اليوم',
    open:'مفتوحة', overdue:'متأخرة', sales:'عمليات بيع', approvals:'طلبات الموافقة', nothing:'لا يوجد شيء.', approve:'موافقة', pay:'تسجيل السداد',
    quickSale:'بيع سريع', total:'الإجمالي شامل الضريبة', complete:'إتمام البيع', invoice:'فاتورة جديدة', customer:'العميل', desc:'الوصف', qty:'الكمية',
    unitPrice:'سعر الوحدة (ج.م)', create:'إنشاء', bill:'فاتورة مورد جديدة', supplier:'المورد', category:'التصنيف', amount:'المبلغ (ج.م)', yourLimit:'حدك الأقصى',
    eta:'الإيصالات الإلكترونية (ETA تجريبي)', online:'ETA متصل', offline:'ETA غير متصل', goOffline:'محاكاة انقطاع الاتصال', goOnline:'عودة الاتصال', sync:'مزامنة الآن',
    waiting:'في الانتظار', submitted:'تم الإرسال', dueSoon:'قريبة الاستحقاق', receipt:'إيصال', hoursLeft:'ساعة متبقية', overdueBy:'ساعة تأخير',
    st_submitted:'تم الإرسال', st_queued:'في الانتظار', st_due_soon:'قريب الاستحقاق', st_overdue:'متأخر', st_rejected:'مرفوض',
    ledger:'دفتر اليومية', balanced:'ميزان المراجعة متوازن', unbalanced:'ميزان المراجعة غير متوازن', lock:'إقفال الفترة', lockNone:'لا يوجد إقفال', soft:'مرن', hard:'نهائي', none:'إلغاء',
    throughDate:'حتى تاريخ', mode:'النوع', reason:'السبب', apply:'تطبيق', reverse:'عكس القيد', reversed:'معكوس', reversal:'قيد عكسي', date:'التاريخ', memo:'البيان', actionCol:'',
    reasonFor:'سبب عكس القيد', audit:'سجل التدقيق', search:'بحث', time:'الوقت', who:'المستخدم', action:'الإجراء', detail:'التفاصيل',
    admin:'المستخدمون والأدوار', export:'تصدير كل البيانات (JSON)', roleCol:'الدور', newRole:'إنشاء دور', roleName:'اسم الدور', sodWarn:'تحذير فصل المهام',
    myWork:'أعمالي الأخيرة', invoices:'الفواتير', bills:'فواتير الموردين', paid:'مدفوعة', pending:'بانتظار الموافقة', approved:'معتمدة',
    advance:'تقديم الساعة 6 ساعات (للتجربة)', noteBox:'نموذج أولي: تبديل مستخدم تجريبي، ETA تجريبي، بيانات في الذاكرة. غير مخصص للمحاسبة الفعلية.',
    codeMissing:'بدون كود صنف', saleDone:'تم تسجيل البيع.', receiptStatus:'الإيصال', saved:'تم.', lang:'English', ok:'حسناً', chooseItems:'أضف كمية لصنف واحد على الأقل.',
    cat_purchases:'مشتريات', cat_rent:'إيجار', cat_utilities:'مرافق', ownBill:'فاتورتك', overLimit:'فوق حدك', unlimited:'بدون حد',
    sodHint:'تم حفظ الدور. راجع التحذير أعلاه.',
  },
};
const state = { lang: 'en', userId: 3, users: [], home: null, items: [], saleMsg: null, roleMsg: null, auditQ: '' };
const t = (k) => T[state.lang][k] ?? T.en[k] ?? k;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const has = (p) => state.home.permissions.includes(p);
const loc = () => (state.lang === 'ar' ? 'ar-EG' : 'en-US');
const money = (p) => (p / 100).toLocaleString(loc(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (state.lang === 'ar' ? ' ج.م' : ' EGP');
const toPiastres = (v) => Math.round(Number(v) * 100);

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'content-type': 'application/json', 'x-user-id': String(state.userId) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) { const e = new Error(data.error?.message ?? 'Error'); e.code = data.error?.code; throw e; }
  return data;
}
let toastTimer;
function toast(msg, ok = false) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = ok ? 'ok' : 'err'; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.style.display = 'none'), 4500);
}
async function run(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg, true); await load(); return r; }
  catch (e) { toast(e.message); }
}

const stateChip = (r) => {
  const cls = { submitted: 'good', queued: '', due_soon: 'warn', overdue: 'bad', rejected: 'bad' }[r.state];
  return `<span class="chip ${cls}">${t('st_' + r.state)}</span>`;
};
const hoursText = (ms) => (ms == null ? '' : ms >= 0 ? `${Math.floor(ms / 3600000)} ${t('hoursLeft')}` : `${Math.ceil(-ms / 3600000)} ${t('overdueBy')}`);

// ---------- cards ----------
const cardStats = (w) => {
  const out = [];
  if (w.cash) out.push(`<div class="card"><h2>${t('cash')}</h2><div class="big">${money(w.cash.balance)}</div></div>`);
  if (w.receivables) out.push(`<div class="card"><h2>${t('receivables')}</h2><div class="big">${money(w.receivables.total)}</div><div class="sub">${w.receivables.count} ${t('open')} · ${w.receivables.overdue} ${t('overdue')}</div></div>`);
  if (w.payables) out.push(`<div class="card"><h2>${t('payables')}</h2><div class="big">${money(w.payables.total)}</div></div>`);
  if (w.todaySales) out.push(`<div class="card"><h2>${t('todaySales')}</h2><div class="big">${money(w.todaySales.total)}</div><div class="sub">${w.todaySales.count} ${t('sales')}</div></div>`);
  return out.length ? `<div class="stats">${out.join('')}</div>` : '';
};

const cardApprovals = (w) => !w.approvals ? '' : `<div class="card"><h2>${t('approvals')}</h2>${w.approvals.length ? `<table>${w.approvals.map((b) => `
  <tr><td>#${b.id} ${esc(b.supplier)}<div class="sub">${t('cat_' + b.category)}</div></td><td class="num">${money(b.amount)}</td>
  <td class="num">${b.canApprove ? `<button class="small primary" data-act="approve" data-id="${b.id}">${t('approve')}</button>` :
    `<span class="chip mute">${b.created_by === state.home.user.id ? t('ownBill') : t('overLimit')}</span>`}</td></tr>`).join('')}</table>` : `<div class="empty">${t('nothing')}</div>`}</div>`;

const cardReceivables = (w) => !w.receivables || !w.receivables.invoices.length ? '' : `<div class="card"><h2>${t('receivables')}</h2><table>${w.receivables.invoices.map((i) => `
  <tr><td>${esc(i.number)} ${esc(i.customer)}<div class="sub">${esc(i.due_date)}</div></td><td class="num">${money(i.total)}</td>
  <td class="num">${has('sales.create') ? `<button class="small" data-act="pay" data-id="${i.id}">${t('pay')}</button>` : ''}</td></tr>`).join('')}</table></div>`;

const cardQuickSale = () => !has('sales.create') ? '' : `<div class="card"><h2>${t('quickSale')}</h2>
  <table>${state.items.map((i) => `<tr><td>${esc(state.lang === 'ar' ? i.name_ar : i.name)}${i.eta_code ? '' : ` <span class="chip warn">${t('codeMissing')}</span>`}</td>
  <td class="num">${money(i.price)}</td><td class="num"><input class="qty" type="number" min="0" value="0" data-sku="${esc(i.sku)}" data-price="${i.price}"></td></tr>`).join('')}</table>
  <div class="row"><span>${t('total')}: <b id="saleTotal">${money(0)}</b></span><button class="primary" data-act="sale">${t('complete')}</button></div>
  ${state.saleMsg ? `<div class="note ${state.saleMsg.cls}">${esc(state.saleMsg.text)}</div>` : ''}</div>`;

const cardInvoice = () => !has('sales.create') ? '' : `<div class="card"><h2>${t('invoice')}</h2>
  <div class="row"><input type="text" id="inv-customer" placeholder="${t('customer')}"></div>
  <div class="row"><input type="text" id="inv-desc" placeholder="${t('desc')}"><input class="qty" type="number" min="1" value="1" id="inv-qty" title="${t('qty')}"><input class="qty" type="number" min="0" step="0.01" id="inv-price" placeholder="${t('unitPrice')}" title="${t('unitPrice')}"></div>
  <div class="row"><button class="primary" data-act="invoice">${t('create')}</button></div></div>`;

const cardBill = () => !has('purchases.create') ? '' : `<div class="card"><h2>${t('bill')}</h2>
  <div class="row"><input type="text" id="bill-supplier" placeholder="${t('supplier')}"><select id="bill-cat"><option value="rent">${t('cat_rent')}</option><option value="utilities">${t('cat_utilities')}</option><option value="purchases">${t('cat_purchases')}</option></select></div>
  <div class="row"><input type="number" min="0" step="0.01" id="bill-amount" placeholder="${t('amount')}"><button class="primary" data-act="bill">${t('create')}</button></div>
  <div class="sub">${t('yourLimit')}: ${state.home.limits['purchases.create'] == null ? t('unlimited') : money(state.home.limits['purchases.create'])}</div></div>`;

const cardMyWork = (w) => !w.myWork ? '' : `<div class="card"><h2>${t('myWork')}</h2>
  <div class="sub">${t('invoices')}</div>${w.myWork.invoices.length ? `<table>${w.myWork.invoices.map((i) => `<tr><td>${esc(i.number)} ${esc(i.customer)}</td><td class="num">${money(i.total)}</td><td><span class="chip ${i.paid ? 'good' : ''}">${i.paid ? t('paid') : t('open')}</span></td></tr>`).join('')}</table>` : `<div class="empty">${t('nothing')}</div>`}
  <div class="sub" style="margin-top:8px">${t('bills')}</div>${w.myWork.bills.length ? `<table>${w.myWork.bills.map((b) => `<tr><td>#${b.id} ${esc(b.supplier)}</td><td class="num">${money(b.amount)}</td><td><span class="chip ${b.status === 'approved' ? 'good' : 'warn'}">${t(b.status === 'approved' ? 'approved' : 'pending')}</span></td></tr>`).join('')}</table>` : `<div class="empty">${t('nothing')}</div>`}</div>`;

const cardEta = (w) => !w.eta ? '' : `<div class="card"><h2>${t('eta')}</h2>
  <div class="row" style="margin-top:0"><span class="chip ${w.eta.online ? 'good' : 'bad'}">${t(w.eta.online ? 'online' : 'offline')}</span>
   <span class="sub">${w.eta.counts.submitted} ${t('submitted')} · ${w.eta.counts.waiting} ${t('waiting')} · ${w.eta.counts.dueSoon} ${t('dueSoon')} · ${w.eta.counts.overdue} ${t('overdue')}</span></div>
  <div class="row">${has('eta.manage') ? `<button data-act="online" data-on="${w.eta.online ? 0 : 1}">${t(w.eta.online ? 'goOffline' : 'goOnline')}</button>` : ''}${has('sales.create') || has('eta.manage') ? `<button class="primary" data-act="sync">${t('sync')}</button>` : ''}</div>
  ${w.eta.receipts.length ? `<table style="margin-top:8px">${w.eta.receipts.slice(0, 8).map((r) => `<tr><td>${t('receipt')} R-${r.sale_id}</td><td>${stateChip(r)}</td><td class="sub">${esc(r.status === 'rejected' ? r.reject_reason : hoursText(r.msLeft))}</td></tr>`).join('')}</table>` : ''}</div>`;

const lockControls = (lock) => `<div class="sub">${t('lock')}: ${lock?.through_date ? `${esc(lock.through_date)} (${t(lock.mode)})` : t('lockNone')}</div>
  ${has('period.lock') ? `<div class="row"><input type="date" id="lock-date" value="${lock?.through_date ?? ''}"><select id="lock-mode"><option value="soft">${t('soft')}</option><option value="hard">${t('hard')}</option><option value="none">${t('none')}</option></select><input type="text" id="lock-reason" placeholder="${t('reason')}"><button data-act="lock">${t('apply')}</button></div>` : ''}`;

const cardLedger = (w) => !w.ledger ? (w.lock !== undefined ? `<div class="card"><h2>${t('lock')}</h2>${lockControls(w.lock)}</div>` : '') : `<div class="card"><h2>${t('ledger')}</h2>
  <span class="chip ${w.ledger.balanced ? 'good' : 'bad'}">${t(w.ledger.balanced ? 'balanced' : 'unbalanced')}</span>
  ${has('ledger.reverse') ? `<div class="row"><input type="text" id="rev-reason" placeholder="${t('reasonFor')}"></div>` : ''}
  <table style="margin-top:8px"><tr><th>#</th><th>${t('date')}</th><th>${t('memo')}</th><th class="num">${t('amount')}</th><th></th></tr>${w.ledger.entries.map((e) => `<tr>
   <td>${e.id}</td><td>${esc(e.entry_date)}</td><td>${esc(e.memo)}</td><td class="num">${money(e.amount)}</td>
   <td>${e.reversed ? `<span class="chip mute">${t('reversed')}</span>` : e.reverses_id ? `<span class="chip mute">${t('reversal')}</span>` : has('ledger.reverse') ? `<button class="small" data-act="reverse" data-id="${e.id}">${t('reverse')}</button>` : ''}</td></tr>`).join('')}</table>
  <div style="margin-top:10px">${lockControls(w.ledger.lock)}</div></div>`;

const cardAudit = (w) => !w.audit ? '' : `<div class="card"><h2>${t('audit')}</h2>
  <div class="row" style="margin-top:0"><input type="text" id="audit-q" value="${esc(state.auditQ)}" placeholder="${t('search')}"><button data-act="audit">${t('search')}</button></div>
  <table style="margin-top:8px">${w.audit.map((a) => `<tr><td class="sub">${new Date(a.ts).toLocaleTimeString(loc())}</td><td>${esc(a.user_name)}</td><td>${esc(a.action)}</td><td class="sub">${esc(a.reason ?? (a.new_value ? a.new_value.slice(0, 40) : ''))}</td></tr>`).join('')}</table></div>`;

const cardAdmin = (w) => !w.admin ? '' : `<div class="card"><h2>${t('admin')}</h2>
  <table>${w.admin.users.map((u) => `<tr><td>${esc(u.name)}</td><td><select data-act="setrole" data-id="${u.id}" ${has('users.manage') ? '' : 'disabled'}>${w.admin.roles.map((r) => `<option value="${r.id}" ${r.name === u.role ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></td></tr>`).join('')}</table>
  ${w.admin.roles.filter((r) => r.sodWarnings.length).map((r) => `<div class="note warn"><b>${esc(r.name)}</b>: ${r.sodWarnings.map((x) => esc(x.reason)).join('; ')}</div>`).join('')}
  ${state.roleMsg ? `<div class="note ${state.roleMsg.cls}">${esc(state.roleMsg.text)}</div>` : ''}
  ${has('roles.manage') ? `<h2 style="margin-top:14px">${t('newRole')}</h2><div class="row" style="margin-top:0"><input type="text" id="role-name" placeholder="${t('roleName')}"><button class="primary" data-act="role">${t('create')}</button></div>
   <div class="perm-grid">${Object.entries(w.admin.permissions).map(([k, d]) => `<label title="${esc(d)}"><input type="checkbox" class="perm" value="${k}"> ${k}</label>`).join('')}</div>` : ''}
  ${has('export.all') ? `<div class="row"><button data-act="export">${t('export')}</button></div>` : ''}</div>`;

function render() {
  const h = state.home;
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('title').textContent = t('title');
  document.getElementById('lbl-user').textContent = t('user');
  document.getElementById('lang').textContent = t('lang');
  document.getElementById('foot').innerHTML = `${esc(t('noteBox'))} <button class="small" data-act="advance">${t('advance')}</button>`;
  const sel = document.getElementById('user');
  sel.innerHTML = state.users.map((u) => `<option value="${u.id}" ${u.id === state.userId ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
  const pill = document.getElementById('etaPill');
  const online = h.widgets.eta ? h.widgets.eta.online : null;
  pill.style.display = online == null ? 'none' : '';
  if (online != null) { pill.className = 'chip ' + (online ? 'good' : 'bad'); pill.textContent = t(online ? 'online' : 'offline'); }
  const w = h.widgets;
  document.getElementById('main').innerHTML = `<div class="role-line">${t('role')}: <b>${esc(h.user.role)}</b> · ${h.permissions.length} ${t('perms')}</div>
    ${cardStats(w)}
    <div class="grid">${cardQuickSale()}${cardEta(w)}${cardApprovals(w)}${cardReceivables(w)}${cardInvoice()}${cardBill()}${cardMyWork(w)}${cardLedger(w)}${cardAudit(w)}${cardAdmin(w)}</div>`;
}

async function load() {
  state.home = await api('GET', '/api/home');
  state.items = has('sales.create') ? await api('GET', '/api/items') : [];
  if (state.home.widgets.audit && state.auditQ) {
    state.home.widgets.audit = await api('GET', '/api/audit?q=' + encodeURIComponent(state.auditQ));
  }
  render();
}

// ---------- events ----------
document.addEventListener('input', (e) => {
  if (e.target.matches('input[data-sku]')) {
    const sum = [...document.querySelectorAll('input[data-sku]')].reduce((s, i) => s + Number(i.value || 0) * Number(i.dataset.price), 0);
    const vat = Math.round((sum * state.home.vatRateBp) / 10000);
    document.getElementById('saleTotal').textContent = money(sum + vat);
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'user') { state.userId = Number(e.target.value); state.saleMsg = null; state.roleMsg = null; run(async () => {}); }
  if (e.target.matches('select[data-act=setrole]')) {
    run(async () => {
      const r = await api('PATCH', '/api/users/' + e.target.dataset.id, { roleId: Number(e.target.value) });
      state.roleMsg = r.sodWarnings.length ? { cls: 'warn', text: `${t('sodWarn')}: ${r.sodWarnings.map((x) => x.reason).join('; ')}` } : { cls: 'good', text: t('saved') };
    });
  }
});
document.addEventListener('click', (e) => {
  if (e.target.id === 'lang') { state.lang = state.lang === 'en' ? 'ar' : 'en'; return render(); }
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, id = b.dataset.id;
  const val = (i) => document.getElementById(i)?.value ?? '';
  if (act === 'pay') run(() => api('POST', `/api/invoices/${id}/pay`), t('saved'));
  if (act === 'approve') run(() => api('POST', `/api/bills/${id}/approve`), t('saved'));
  if (act === 'sale') {
    const items = [...document.querySelectorAll('input[data-sku]')].filter((i) => Number(i.value) > 0).map((i) => ({ sku: i.dataset.sku, qty: Number(i.value) }));
    if (!items.length) return toast(t('chooseItems'));
    run(async () => {
      const r = await api('POST', '/api/sales/quick', { items });
      const rej = r.receipt.status === 'rejected';
      state.saleMsg = { cls: rej ? 'bad' : r.receipt.status === 'queued' ? 'warn' : 'good', text: `${t('saleDone')} ${money(r.sale.total)} · ${t('receiptStatus')}: ${t('st_' + r.receipt.status)}` };
    });
  }
  if (act === 'invoice') run(async () => {
    await api('POST', '/api/invoices', { customer: val('inv-customer'), lines: [{ description: val('inv-desc'), qty: Number(val('inv-qty')), unitPrice: toPiastres(val('inv-price')) }] });
  }, t('saved'));
  if (act === 'bill') run(async () => {
    const r = await api('POST', '/api/bills', { supplier: val('bill-supplier'), category: val('bill-cat'), amount: toPiastres(val('bill-amount')) });
    toast(t(r.status === 'approved' ? 'approved' : 'pending'), true);
  });
  if (act === 'sync') run(() => api('POST', '/api/eta/sync'), t('saved'));
  if (act === 'online') run(() => api('POST', '/api/eta/online', { online: b.dataset.on === '1' }));
  if (act === 'reverse') run(() => api('POST', `/api/entries/${id}/reverse`, { reason: val('rev-reason') }), t('saved'));
  if (act === 'lock') run(() => api('POST', '/api/period-lock', { through: val('lock-date'), mode: val('lock-mode'), reason: val('lock-reason') }), t('saved'));
  if (act === 'audit') { state.auditQ = val('audit-q'); run(async () => {}); }
  if (act === 'advance') run(() => api('POST', '/api/dev/advance-clock', { hours: 6 }), t('saved'));
  if (act === 'role') run(async () => {
    const perms = [...document.querySelectorAll('input.perm:checked')].map((i) => i.value);
    const r = await api('POST', '/api/roles', { name: val('role-name'), permissions: perms });
    state.roleMsg = r.sodWarnings.length ? { cls: 'warn', text: `${t('sodWarn')}: ${r.sodWarnings.map((x) => x.reason).join('; ')}` } : { cls: 'good', text: t('saved') };
  });
  if (act === 'export') run(async () => {
    const data = await api('GET', '/api/export');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = 'accounting-export.json'; a.click();
  });
});

(async () => {
  state.users = await (await fetch('/api/demo-users')).json();
  await load();
})();
</script>
</body>
</html>
