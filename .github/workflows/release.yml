name: release

# Creates a GitHub release with a source zip when a version tag is pushed,
# or on demand for an existing tag (Actions tab, "Run workflow").
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the tagged code
        run: npm test
      - name: Build package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git archive --format=zip --prefix="accounting-poc-${TAG}/" -o "accounting-poc-${TAG}.zip" "${TAG}"
          awk -v t="${TAG#v}" '$0 ~ "^## \\[" t "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release ${TAG}. See ROADMAP.md and docs/PLAN.md." > notes.md
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "accounting-poc-${TAG}.zip" --clobber
          else
            gh release create "${TAG}" "accounting-poc-${TAG}.zip" --title "${TAG}" --notes-file notes.md --verify-tag
          fi
