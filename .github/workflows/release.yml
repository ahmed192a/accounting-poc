name: release

# Releases are driven by .github/release-manifest.txt (one "<tag> <commit>" per line).
# Pushing a change to that file creates every missing tag and release, each with a source zip.
# You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['.github/release-manifest.txt', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create missing tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          grep -Ev '^\s*(#|$)' .github/release-manifest.txt | while read -r TAG SHA; do
            if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG exists"; continue; fi
            echo "Releasing $TAG at $SHA"
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag -a "$TAG" "$SHA" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            git archive --format=zip --prefix="accounting-poc-$TAG/" -o "accounting-poc-$TAG.zip" "$TAG"
            git show "$TAG:CHANGELOG.md" > /dev/null 2>&1 || true
            awk -v t="${TAG#v}" '$0 ~ "^## \\[" t "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "Release $TAG. See ROADMAP.md and docs/PLAN.md." > notes.md
            gh release create "$TAG" "accounting-poc-$TAG.zip" --title "$TAG" --notes-file notes.md --verify-tag
          done
