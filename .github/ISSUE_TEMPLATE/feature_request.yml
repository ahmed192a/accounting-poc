name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and for which role (owner, manager, clerk, accountant, auditor, admin)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: compliance
    attributes:
      label: Tax or compliance angle
      description: Mention any official source. Unverified rules must be flagged as such.
